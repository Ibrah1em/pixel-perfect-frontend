name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        run: bun install

      - name: Build Project
        run: bun run build
        env:
          VITE_SUPABASE_URL: "https://c--bb18dc64-7355-434e-ae0f-9e21b939ac07-prod.lovable.cloud"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_XOAelUTY2PjC1JOkqdeabA_yJYqopZr"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
